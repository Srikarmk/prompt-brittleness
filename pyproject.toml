[project]
name = "prompt-brittleness"
version = "0.1.0"
description = "How often do LLM answers change when a prompt is rephrased in ways that should not matter? A measured study on GSM8K, MMLU and E2E extraction."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kameswara Sai Srikar Manda" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.scripts]
brittle = "brittle.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brittle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
